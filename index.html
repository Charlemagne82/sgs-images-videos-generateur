<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS images/vidéos générateur</title>
    <style>
        :root {
            --vert: #2ecc71; --jaune: #f1c40f; --rouge: #e74c3c;
            --blanc: #ffffff; --noir: #1a1a1a; --violet: #8e44ad;
        }
        body {
            font-family: 'Arial', sans-serif; background-color: var(--noir);
            color: var(--blanc); margin: 0; padding: 20px;
            text-align: center; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh;
        }
        .logo-container {
            width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(var(--vert), var(--jaune), var(--rouge), var(--violet), var(--vert));
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px; box-shadow: 0 0 25px var(--violet);
            animation: rotation 10s linear infinite;
        }
        .logo-inner {
            width: 105px; height: 105px; border-radius: 50%; background: var(--noir);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; border: 2px solid var(--blanc);
            font-weight: bold; font-size: 12px; line-height: 1.1;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .logo-inner span { color: var(--jaune); font-size: 16px; margin-bottom: 2px; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        h1 { color: var(--jaune); font-size: 1.5rem; margin-bottom: 5px; }
        p.subtitle { color: var(--vert); font-size: 0.9rem; margin-bottom: 20px; }
        
        .form-container {
            background: #2a2a2a; padding: 20px; border-radius: 15px;
            width: 100%; max-width: 400px; border: 2px solid var(--violet);
            box-shadow: 0 0 15px rgba(142, 68, 173, 0.3); margin-bottom: 20px;
        }
        
        .api-section {
            background: #1a1a1a; padding: 15px; border-radius: 10px;
            border: 1px solid var(--jaune); margin-bottom: 20px;
        }
        .api-section input { width: 80%; padding: 8px; border-radius: 5px; margin-bottom: 10px; }
        .api-section button { width: 40%; padding: 8px; font-size: 0.8rem; }

        label { display: block; text-align: left; margin-bottom: 8px; color: var(--vert); font-weight: bold; }
        select, textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--vert);
            background: #333; color: var(--blanc); font-size: 1rem; margin-bottom: 15px;
            box-sizing: border-box;
        }
        textarea { height: 80px; resize: vertical; }
        
        .upload-btn {
            background: var(--violet); color: var(--blanc); border: 2px dashed var(--blanc);
            padding: 15px; border-radius: 8px; font-size: 1rem; font-weight: bold;
            cursor: pointer; width: 100%; margin-bottom: 15px; display: block;
        }
        
        button.main-btn {
            background: var(--vert); color: var(--noir); border: none;
            padding: 15px; border-radius: 8px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; width: 100%;
            transition: background 0.3s; text-transform: uppercase;
        }
        button.main-btn:hover { background: var(--jaune); }
        button.main-btn:disabled { background: #555; cursor: not-allowed; }
        
        .loader { display: none; margin-top: 20px; color: var(--jaune); font-weight: bold; font-size: 0.9rem; }
        .video-result { display: none; margin-top: 20px; width: 100%; max-width: 400px; }
        .video-result video { width: 100%; border-radius: 10px; border: 2px solid var(--vert); }
        #image-preview { display: none; width: 100%; border-radius: 10px; margin-bottom: 15px; border: 2px solid var(--jaune); max-height: 200px; object-fit: contain; background: #000;}
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo-inner">
            <span>SGS</span>
            Images/Vidéos<br>Générateur
        </div>
    </div>

    <h1>SGS Générateur</h1>
    <p class="subtitle">Propulsé par l'Intelligence Artificielle</p>

    <div class="form-container api-section">
        <label style="color: var(--jaune);">🔑 Votre Clé API Agnes :</label>
        <input type="password" id="api-key" placeholder="Collez votre clé sk-...">
        <button onclick="saveApiKey()" style="background: var(--jaune); color: var(--noir);">Sauvegarder</button>
    </div>

    <div class="form-container">
        <label>1. Ajoutez une photo :</label>
        <label for="file-upload" class="upload-btn" id="upload-label">
            📷 Choisir une photo
        </label>
        <input type="file" id="file-upload" accept="image/*" style="display:none;" onchange="previewImage(event)">
        <img id="image-preview" alt="Aperçu de votre photo">

        <label for="style">2. Univers :</label>
        <select id="style">
            <option value="comique">😂 Comique & Humour</option>
            <option value="documentaire">🎥 Documentaire</option>
            <option value="odyssee">🌍 Odyssée & Mythologie</option>
            <option value="predication">✝️ Prédication Biblique</option>
            <option value="histoire">📜 Histoire de l'Église</option>
        </select>

        <!-- NOUVEAU : Choix du format -->
        <label for="format">3. Format de la vidéo :</label>
        <select id="format">
            <option value="9:16 (Portrait - TikTok/Reels/Shorts)">📱 9:16 (Portrait - TikTok/Reels)</option>
            <option value="16:9 (Paysage - YouTube/Cinéma)">🖥️ 16:9 (Paysage - YouTube)</option>
            <option value="1:1 (Carré - Instagram)">⬛ 1:1 (Carré - Instagram)</option>
            <option value="4:5 (Portrait large - Feed)">📱 4:5 (Portrait large)</option>
        </select>

        <label for="langue">4. Langue de la voix :</label>
        <select id="langue">
            <option value="fr-FR">🇫🇷 Français</option>
            <option value="ln-CD">🇨🇩 Lingala</option>
            <option value="sw-KE">🇹🇿 Swahili</option>
            <option value="yo-NG">🇳🇬 Yoruba</option>
            <option value="ha-NG">🇳🇬 Haoussa</option>
            <option value="en-US">🇬🇧 Anglais</option>
        </select>

        <label for="prompt">5. Décrivez l'action (ou l'histoire à raconter) :</label>
        <textarea id="prompt" placeholder="Ex: Fais bouger doucement les cheveux, ajoute une lumière dorée et un sourire..."></textarea>

        <button class="main-btn" id="generate-btn" onclick="generateVideo()">
            Créer la vidéo
        </button>
    </div>

    <div class="loader" id="loader">⏳ L'Intelligence Artificielle travaille... (Veuillez patienter)</div>
    
    <div class="video-result" id="video-result">
        <h3 style="color: var(--jaune);">✨ Votre Vidéo :</h3>
        <video id="result-video" controls playsinline></video>
    </div>

    <script>
        let imageBase64 = ""; 

        document.getElementById('api-key').value = localStorage.getItem('agnes_api_key') || '';

        function saveApiKey() {
            const key = document.getElementById('api-key').value.trim();
            if(key.startsWith('sk-')) {
                localStorage.setItem('agnes_api_key', key);
                alert('✅ Clé API sauvegardée !');
            } else {
                alert('❌ La clé doit commencer par "sk-".');
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                imageBase64 = e.target.result; 
                const preview = document.getElementById('image-preview');
                preview.src = imageBase64;
                preview.style.display = 'block';
                document.getElementById('upload-label').innerHTML = "✅ Photo sélectionnée (Appuyez pour changer)";
                document.getElementById('upload-label').style.background = "var(--vert)";
                document.getElementById('upload-label').style.color = "var(--noir)";
            };
            reader.readAsDataURL(file);
        }

        async function generateVideo() {
            const apiKey = localStorage.getItem('agnes_api_key');
            const prompt = document.getElementById('prompt').value;
            const style = document.getElementById('style').value;
            const format = document.getElementById('format').value;
            const langue = document.getElementById('langue').value;

            if (!apiKey) { alert('⚠️ Sauvegardez d\'abord votre clé API.'); return; }
            if (!imageBase64) { alert('⚠️ Veuillez choisir une photo de votre galerie.'); return; }
            if (!prompt) { alert('⚠️ Veuillez décrire ce que l\'IA doit faire.'); return; }

            speakText(prompt, langue);

            const btn = document.getElementById('generate-btn');
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('video-result');
            const videoElement = document.getElementById('result-video');

            btn.disabled = true;
            loader.style.display = 'block';
            resultDiv.style.display = 'none';

            try {
                // On intègre le format choisi dans le prompt !
                let finalPrompt = `Style: ${style}. ${prompt}. Aspect ratio: ${format}, high quality, cinematic.`;
                
                let response;
                let retries = 0;
                const maxRetries = 5;

                while (retries <= maxRetries) {
                    response = await fetch('https://apihub.agnes-ai.com/v1/videos', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'agnes-video-v2.0',
                            prompt: finalPrompt,
                            image: imageBase64, 
                            num_frames: 121,
                            frame_rate: 24
                            // Certaines API acceptent aussi aspect_ratio: format, 
                            // mais l'écrire dans le prompt marche toujours.
                        })
                    });

                    if (response.status === 503) {
                        retries++;
                        loader.innerHTML = `⏳ File d'attente pleine. Nouvelle tentative dans 20s (${retries}/${maxRetries})...`;
                        await new Promise(r => setTimeout(r, 20000));
                    } else {
                        break;
                    }
                }

                if (response.status === 503) {
                    throw new Error("Le serveur est surchargé. Réessayez dans 5 minutes.");
                }
                if (!response.ok) {
                    throw new Error("Erreur de l'API : " + response.status);
                }

                const data = await response.json();
                const videoId = data.video_id || data.id;
                
                if(!videoId) throw new Error("Pas d'ID reçu.");

                loader.innerHTML = "⏳ Création en cours... (1 à 3 minutes)";
                
                let videoUrl = null;
                while (!videoUrl) {
                    await new Promise(r => setTimeout(r, 8000)); 
                    
                    const pollRes = await fetch(`https://apihub.agnes-ai.com/agnesapi?video_id=${videoId}&model_name=agnes-video-v2.0`, {
                        method: 'GET',
                        headers: { 'Authorization': 'Bearer ' + apiKey }
                    });
                    
                    const pollData = await pollRes.json();
                    
                    if (pollData.status === 'completed' || pollData.status === 'succeeded') {
                        videoUrl = pollData.metadata?.url || pollData.url;
                    } else if (pollData.status === 'failed') {
                        throw new Error("La génération a échoué.");
                    }
                }

                videoElement.src = videoUrl;
                resultDiv.style.display = 'block';
                
            } catch (error) {
                alert("❌ Oups : " + error.message);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
                loader.innerHTML = "⏳ L'Intelligence Artificielle travaille... (Veuillez patienter)";
            }
        }

        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
